<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zoo Drop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="hud">
    <div class="tag tag-score"><span class="lbl">Score</span><span id="score">0</span></div>
    <div class="tag tag-next"><span class="lbl">Next</span><img id="next-img" alt=""></div>
    <div class="tag tag-best"><span class="lbl">Best</span><span id="best">0</span></div>
  </div>
  <div id="chain" aria-hidden="true"></div>
  <div id="board">
    <canvas id="game"></canvas>
    <div id="overlay" class="hidden">
      <div class="card">
        <div class="card-title">Game Over</div>
        <div class="card-score"><span class="lbl">Score</span><span id="final-score">0</span></div>
        <div id="new-best" class="new-best hidden">New best!</div>
        <button id="btn-again" class="btn btn-big">Play again</button>
      </div>
    </div>
    <div id="hint">Tap to drop</div>
    <div id="target-hint" class="hidden">Tap an animal <small>(tap empty space to cancel)</small></div>
  </div>
  <input type="checkbox" switch id="haptic-switch" class="haptic-switch" aria-hidden="true" tabindex="-1">
  <div id="footer">
    <button id="btn-mute" class="btn btn-icon" aria-label="Sound">&#9835;</button>
    <div id="powers">
      <button class="btn power" data-power="bomb" aria-label="Bomb: remove one animal">
        <svg viewBox="0 0 32 32" width="30" height="30"><circle cx="14" cy="19" r="10" fill="#3f2d20"/><rect x="16" y="6" width="6" height="5" rx="1.5" transform="rotate(35 19 8.5)" fill="#8a6d52"/><path d="M22 6 l3-4" stroke="#e8604c" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="26" cy="2" r="2" fill="#f7c948"/><circle cx="10.5" cy="15.5" r="2.5" fill="#fff" opacity=".8"/></svg>
        <span class="count"></span>
      </button>
      <button class="btn power" data-power="boost" aria-label="Upgrade one animal">
        <svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 3 l4 8 9 1.3-6.5 6.2 1.6 8.8L16 23l-8.1 4.3 1.6-8.8L3 12.3 12 11z" fill="#f7c948" stroke="#3f2d20" stroke-width="2.2" stroke-linejoin="round"/></svg>
        <span class="count"></span>
      </button>
      <button class="btn power" data-power="lift" aria-label="Raise the line">
        <svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 4 l8 9h-5v8h-6v-8H8z" fill="#79b94c" stroke="#3f2d20" stroke-width="2.2" stroke-linejoin="round"/><path d="M4 27h4M11 27h4M18 27h4M25 27h4" stroke="#e8604c" stroke-width="2.5" stroke-linecap="round"/></svg>
        <span class="count"></span>
      </button>
      <button class="btn power" data-power="shuffle" aria-label="Shuffle: toss every animal around">
        <svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 5a11 11 0 1 1-10.5 7.6" fill="none" stroke="#3f7fc8" stroke-width="3.2" stroke-linecap="round"/><path d="M3 7l2.5 6.4L12 11" fill="none" stroke="#3f7fc8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="3.2" fill="#f7c948" stroke="#3f2d20" stroke-width="1.8"/></svg>
        <span class="count"></span>
      </button>
    </div>
    <button id="btn-restart" class="btn btn-icon" aria-label="Restart">&#8635;</button>
  </div>
</div>
<script src="lib/matter.min.js"></script>
<script src="game.js"></script>
</body>
</html>
